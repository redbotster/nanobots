apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: draft-replies
  version: 0.1.0
  description: Write a reply draft in my voice for each thread you're given; never send.
  tags: [email, gmail, drafts]
  author: nanobots-community
  license: MIT

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 4000
    temperature: 0.4

  services:
    - id: gmail
      provider: google
      scopes: [gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      - name: threads
        type: list<json>
        required: true
      - name: voice_sample
        type: file
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Direct and warm. Short paragraphs. Never promise a date I haven't confirmed."
    outputs:
      - name: draft_ids
        type: list<string>
      - name: drafts
        type: list<json>
        schema: ./schemas/draft.json

  steps:
    # Staying consistent with what was already promised matters more than
    # any style rule. Optional: the default memory backend is key/value and
    # can't answer questions, so drafting still runs without it — just
    # without the benefit. See docs/memory.md.
    - name: recall_history
      type: memory.recall
      optional: true
      query: "What has this person already told these correspondents — commitments made, things declined — and how formally do they write to them?"
    - name: write
      type: ai.generate
      prompt_file: ./prompts/draft.md
      inputs: { threads: "{{inputs.threads}}", instructions: "{{inputs.instructions}}", voice_sample: "{{inputs.voice_sample}}", learned: "{{steps.recall_history.output}}" }
      outputs:
        drafts: "{{steps.write.output.drafts}}"
    - name: create
      type: service.call
      service: gmail
      op: drafts.create
      params: { drafts: "{{steps.write.output.drafts}}" }
      outputs:
        draft_ids: "{{steps.create.output.draft_ids}}"
    # Feed today's drafts back in, so a recall-capable backend can tell
    # next week what was already promised. A no-op on key/value backends.
    - name: note_drafts
      type: memory.remember
      value: "Drafted in reply: {{steps.write.output.drafts}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 180
    network_egress: [googleapis.com]
    writes_allowed: [gmail]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
