apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: draft-replies
  version: 0.1.0
  description: Write a reply draft in my voice for each thread you're given; never send.
  tags: [email, gmail, drafts]
  author: nanobots-community
  license: MIT

spec:
  harness:
    type: openclaw
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 4000
    temperature: 0.4

  services:
    - id: gmail
      provider: google
      scopes: [gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      - name: threads
        type: list<json>
        required: true
      - name: voice_sample
        type: file
    outputs:
      - name: draft_ids
        type: list<string>
      - name: drafts
        type: list<json>

  steps:
    - name: write
      type: ai.generate
      prompt_file: ./prompts/draft.md
      inputs: { threads: "{{inputs.threads}}" }
      outputs:
        drafts: "{{steps.write.output.drafts}}"
    - name: create
      type: service.call
      service: gmail
      op: drafts.create
      params: { drafts: "{{steps.write.output.drafts}}" }
      outputs:
        draft_ids: "{{steps.create.output.draft_ids}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 180
    network_egress: [googleapis.com]
    writes_allowed: [gmail]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
