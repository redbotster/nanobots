apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: x-mentions
  version: 0.1.0
  description: Fetch recent posts that mentioned you on X.
  tags: [social, x, listening]
  author: nanobots-community
  license: LicenseRef-Nanobots-SUL

spec:
  harness:
    type: bare
    entrypoint: ./bot.md

  services:
    - id: x
      provider: x
      connection: demo

  ports:
    inputs:
      # Every read is billed. X removed the free tier in February 2026 and
      # charges per post read, cheapest when an account reads its own
      # mentions. So this is a cost control the user sets, not a page size
      # the bot picks.
      - name: max_results
        type: string
        required: false
        default: "25"
        description: "How many mentions to pull, at most 100. Each one is a billed read."
      # There was a since_id input here, described as "carry the last run's
      # newest id here to stop paying for the same posts twice". Nothing
      # carried it: listen-and-reply passes only max_results, so every
      # weekday run re-read and re-paid for the same twenty-five posts, and
      # comment-responder drafted replies to mentions it had already
      # answered. A port whose description tells you to do something the
      # system gives you no way to do is worse than no port. The bot
      # remembers it itself now, below.
    outputs:
      - name: mentions
        type: list<json>
        schema: ./schemas/mentions.json

  steps:
    # The id of the newest mention this bot has already handed on. Empty on
    # the first ever run, which X reads as "no lower bound" — so a new
    # install sees the recent mentions once and pays for them once.
    - name: seen
      type: memory.get
      key: newest_mention_id
      output: seen
    - name: fetch
      type: service.call
      service: x
      op: mentions.list
      params: { max_results: "{{inputs.max_results}}", since_id: "{{steps.seen.output}}" }
    # Nothing new is the common case on a weekday cron, and it must not look
    # like a failure or run the drafting behind it. See docs/bot-contract.md.
    - name: anything
      type: stop.if
      value: "{{steps.fetch.output.count}}"
      equals: "0"
      summary: "no new mentions since the last run"
    # After the gate: a run that stopped has handed nothing on, so it must
    # not move the bookmark past posts nobody has read.
    - name: remember
      type: memory.put
      key: newest_mention_id
      value: "{{steps.fetch.output.newest_id}}"
    - name: emit
      type: transform.pick
      data: "{{steps.fetch.output.mentions}}"
      outputs:
        mentions: "{{steps.fetch.output.mentions}}"

  guardrails:
    pii: allow
    injection_threshold: 0.7
    max_runtime_secs: 60
    writes_allowed: []

  resources:
    preset: small
    memory: 128Mi
    cpu: 100m
