apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: calendar-scheduler
  version: 0.1.0
  description: Read a scheduling request and draft a reply with three open slots.
  tags: [calendar, gmail, scheduling]
  author: nanobots-community
  license: MIT

spec:
  harness:
    type: openclaw
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 2000
    temperature: 0.3

  services:
    - id: calendar
      provider: google
      scopes: [calendar.readonly]
      required: true
      connection: demo
    - id: gmail
      provider: google
      scopes: [gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      - name: thread
        type: json
        required: true
      - name: working_hours
        type: string
        default: "9am-5pm Mon-Fri, America/Chicago"
    outputs:
      - name: slots
        type: list<datetime>
      - name: draft_id
        type: string

  steps:
    - name: fetch_events
      type: service.call
      service: calendar
      op: events.list
      params: { calendar_id: primary, time_min: "{{run.started_at}}", time_max: "{{run.started_at}}" }
    - name: propose
      type: ai.generate
      prompt_file: ./prompts/propose.md
      inputs: { thread: "{{inputs.thread}}", working_hours: "{{inputs.working_hours}}", busy: "{{steps.fetch_events.output}}" }
      outputs:
        slots: "{{steps.propose.output.slots}}"
    - name: draft
      type: service.call
      service: gmail
      op: drafts.create
      params:
        drafts:
          - to: "{{inputs.thread.from}}"
            subject: "Re: {{inputs.thread.subject}}"
            body: "{{steps.propose.output.reply_body}}"
      outputs:
        draft_id: "{{steps.draft.output.draft_ids.0}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 120
    network_egress: [googleapis.com]
    writes_allowed: [gmail]
    # Drafts only — never creates a calendar event or sends anything on its
    # own, matching the catalog's own "never creates events without
    # approval" rule for this brick.

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
