apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: calendar-scheduler
  version: 0.1.0
  description: Read a scheduling request and draft a reply with three open slots.
  tags: [calendar, gmail, scheduling]
  author: nanobots-community
  license: LicenseRef-Nanobots-SUL

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 2000
    temperature: 0.3

  services:
    - id: calendar
      provider: google
      scopes: [calendar.readonly]
      required: true
      connection: demo
    - id: gmail
      provider: google
      scopes: [gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      # Who the reply goes to, as a field rather than something read out of
      # `thread`. It used to be `{{inputs.thread.from}}`, which is correct
      # for a mail thread and resolved to nothing for lead-to-meeting's lead
      # record — so the bot drafted an email with no recipient and the swarm
      # called it a success. A model could have picked the address out of
      # whatever it was given, and deliberately does not: an address that
      # comes from a declared field cannot be moved by a line of prose
      # inside the data.
      - name: to
        type: string
        required: true
      - name: subject
        type: string
        default: "Finding a time to talk"
      - name: thread
        type: json
        required: true
      - name: working_hours
        type: string
        default: "9am-5pm Mon-Fri, America/Chicago"
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Prefer mornings. Never propose a slot inside an existing meeting or in the next 2 hours."
    outputs:
      - name: slots
        type: list<datetime>
      - name: draft_id
        type: string
      # What the draft is about, so whatever sends it can say so.
      # email-send-approved asks a human to authorise a real send and shows
      # them this; every other swarm in the catalog snaps a `.subject` into
      # it, and lead-to-meeting had nothing to snap, so it sent the
      # enricher's fit_score instead and the question read "medium".
      - name: subject
        type: string

  steps:
    - name: fetch_events
      type: service.call
      service: calendar
      op: events.list
      params: { calendar_id: primary, time_min: "{{run.started_at}}", time_max: "{{run.started_at}}" }
    - name: propose
      type: ai.generate
      prompt_file: ./prompts/propose.md
      inputs: { thread: "{{inputs.thread}}", working_hours: "{{inputs.working_hours}}", busy: "{{steps.fetch_events.output}}", instructions: "{{inputs.instructions}}" }
      outputs:
        slots: "{{steps.propose.output.slots}}"
    - name: draft
      type: service.call
      service: gmail
      op: drafts.create
      params:
        drafts:
          - to: "{{inputs.to}}"
            subject: "{{inputs.subject}}"
            body: "{{steps.propose.output.reply_body}}"
      outputs:
        draft_id: "{{steps.draft.output.draft_ids.0}}"
        subject: "{{inputs.subject}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 120
    network_egress: [googleapis.com]
    writes_allowed: [gmail]
    # Drafts only — never creates a calendar event or sends anything on its
    # own, matching the catalog's own "never creates events without
    # approval" rule for this brick.

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
