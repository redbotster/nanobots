apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: inbox-triage
  version: 0.1.0
  description: Sort new mail into reply today / read later / ignore and label it.
  tags: [email, gmail, triage]
  author: nanobots-community
  license: LicenseRef-Nanobots-SUL

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 4000
    temperature: 0.2

  services:
    - id: gmail
      provider: google
      scopes: [gmail.readonly, gmail.labels]
      required: true
      connection: demo

  ports:
    inputs:
      - name: since
        type: datetime
        default: "{{memory.last_run_at | default: now-24h}}"
      - name: rules
        type: string
        default: "Reply today: anything from a client, a contract, or with a deadline this week. Read later: newsletters and FYI threads worth skimming. Ignore: automated notifications with nothing actionable."
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Anything from a customer or about billing is urgent. Newsletters never are."
    outputs:
      - name: urgent
        type: list<json>
      - name: later
        type: list<json>
      - name: triaged_count
        type: json
        schema: ./schemas/triaged_count.json

  steps:
    - name: fetch
      type: service.call
      service: gmail
      op: messages.list
      params: { q: "after:{{inputs.since}}", max: 200 }
    # What this person has actually treated as urgent before beats any
    # static rule list. Optional: the default memory backend is key/value
    # and can't answer questions, so triage still runs without it — just
    # without the benefit. See docs/memory.md.
    - name: recall_urgency
      type: memory.recall
      optional: true
      query: "What kinds of message has this person treated as urgent before, and what have they consistently ignored?"
    - name: triage
      type: ai.generate
      prompt_file: ./prompts/triage.md
      inputs: { messages: "{{steps.fetch.output}}", rules: "{{inputs.rules}}", instructions: "{{inputs.instructions}}", learned: "{{steps.recall_urgency.output}}" }
      outputs:
        urgent: "{{steps.triage.output.urgent}}"
        later: "{{steps.triage.output.later}}"
        triaged_count: "{{steps.triage.output.counts}}"
    - name: label
      type: service.call
      service: gmail
      op: messages.modify
      params: { urgent: "{{steps.triage.output.urgent}}", later: "{{steps.triage.output.later}}" }
    # Feed today's call back in, so a recall-capable backend has something
    # to derive from. A no-op on key/value backends.
    - name: note_urgency
      type: memory.remember
      value: "Triaged as urgent: {{steps.triage.output.urgent}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 180
    network_egress: [googleapis.com]
    writes_allowed: [gmail]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
