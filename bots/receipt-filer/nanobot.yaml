apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: receipt-filer
  version: 0.1.0
  description: Pull receipts and invoices out of mail and log a row per batch.
  tags: [receipts, bookkeeping, sheets]
  author: nanobots-community
  license: LicenseRef-Nanobots-SUL

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 2500
    temperature: 0.1

  services:
    - id: gmail
      provider: google
      scopes: [gmail.readonly]
      required: true
      connection: demo
    - id: sheets
      provider: google
      scopes: [spreadsheets]
      required: true
      connection: demo

  ports:
    inputs:
      - name: since
        type: datetime
        default: "{{memory.last_run_at | default: now-24h}}"
      - name: sheet
        type: string
        default: "Receipts-2026"
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Category matters more than vendor. Flag anything over $500."
    outputs:
      - name: receipts
        type: list<json>
      - name: rows_added
        type: string

  steps:
    - name: fetch
      type: service.call
      service: gmail
      op: messages.list
      params: { q: "after:{{inputs.since}} (receipt OR invoice OR \"payment confirmation\")", max: 100 }
    - name: extract
      type: ai.generate
      prompt_file: ./prompts/extract.md
      inputs: { messages: "{{steps.fetch.output}}", instructions: "{{inputs.instructions}}" }
      outputs:
        receipts: "{{steps.extract.output.receipts}}"
    - name: log_row
      type: service.call
      service: sheets
      op: rows.append
      params:
        sheet: "{{inputs.sheet}}"
        values: { date: "{{run.started_at}}", count: "{{steps.extract.output.count}}", total: "{{steps.extract.output.total}}" }
      outputs:
        rows_added: "{{steps.log_row.output.row_number}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 120
    network_egress: [googleapis.com]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
