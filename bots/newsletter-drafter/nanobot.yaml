apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: newsletter-drafter
  version: 0.1.0
  description: Assemble a newsletter draft from links, notes, and recent posts.
  tags: [content, newsletter, gmail]
  author: nanobots-community
  license: MIT

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 3000
    temperature: 0.5

  services:
    - id: gmail
      provider: google
      scopes: [gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      - name: sources
        type: list<string>
        required: true
      - name: blurbs
        type: list<string>
        required: true
      - name: template
        type: file
        required: false
      - name: to
        type: string
        default: me@example.com
    outputs:
      - name: draft_html
        type: file
        mime: text/html
      - name: draft_id
        type: string

  steps:
    - name: compose
      type: ai.generate
      prompt_file: ./prompts/compose.md
      inputs: { sources: "{{inputs.sources}}", blurbs: "{{inputs.blurbs}}" }
    - name: render
      type: transform.render
      template: ./templates/newsletter.html
      to: html
      output: draft_html
    - name: draft
      type: service.call
      service: gmail
      op: drafts.create
      params:
        drafts:
          - to: "{{inputs.to}}"
            subject: "{{steps.compose.output.subject}}"
            body: "{{steps.compose.output.intro}}"
      outputs:
        draft_id: "{{steps.draft.output.draft_ids.0}}"

  guardrails:
    pii: allow
    injection_threshold: 0.7
    max_runtime_secs: 120
    network_egress: [googleapis.com]
    writes_allowed: [gmail]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
