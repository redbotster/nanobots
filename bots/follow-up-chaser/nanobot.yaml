apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: follow-up-chaser
  version: 0.1.0
  description: Find threads I sent that got no reply in N days and draft a polite nudge.
  tags: [email, gmail, follow-up]
  author: nanobots-community
  license: LicenseRef-Nanobots-SUL

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 3000
    temperature: 0.3

  services:
    - id: gmail
      provider: google
      scopes: [gmail.readonly, gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      - name: days_silent
        type: string
        default: "3"
      - name: exclude_labels
        type: list<string>
        required: false
      # What this bot marks a thread with once it has nudged it, and the
      # label the search below excludes. A nudge is a real email to a real
      # person: sending one is right, sending one every weekday until they
      # answer is harassment with a cron expression.
      - name: nudged_label
        type: string
        required: false
        default: "nanobots-nudged"
        description: "Gmail label put on a thread once it has been nudged, and excluded from the next search. Change it to nudge a set again from scratch."
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Polite and low-pressure. One short paragraph. Never imply urgency that isn't real."
    outputs:
      - name: stale_threads
        type: list<json>
        schema: ./schemas/stale_thread.json
      - name: draft_ids
        type: list<string>

  steps:
    # -label: is the whole dedupe. Gmail answers "which of these have I not
    # nudged yet" out of its own index, so nothing here has to keep a set of
    # thread ids, and what the bot has done is visible in the user's own
    # mailbox rather than in a state file they cannot see.
    - name: fetch
      type: service.call
      service: gmail
      op: messages.list
      params:
        q: "in:sent older_than:{{inputs.days_silent}}d -label:{{inputs.nudged_label}}"
        max: 100
    - name: find_and_draft
      type: ai.generate
      prompt_file: ./prompts/nudge.md
      inputs: { sent: "{{steps.fetch.output}}", exclude_labels: "{{inputs.exclude_labels}}", instructions: "{{inputs.instructions}}" }
      outputs:
        stale_threads: "{{steps.find_and_draft.output.stale_threads}}"
    # Nothing stale is the ordinary outcome once the backlog is cleared, and
    # it must not run the sender behind it (docs/bot-contract.md).
    - name: anything
      type: stop.if
      value: "{{steps.find_and_draft.output.stale_threads}}"
      equals: "[]"
      summary: "nothing sent has gone unanswered long enough to nudge"
    - name: create
      type: service.call
      service: gmail
      op: drafts.create
      params: { drafts: "{{steps.find_and_draft.output.drafts}}" }
      outputs:
        draft_ids: "{{steps.create.output.draft_ids}}"
    # Last, and only once the drafts exist: a thread marked nudged that was
    # never actually nudged is silently dropped for good.
    - name: mark
      type: service.call
      service: gmail
      op: messages.label
      params:
        ids: "{{steps.find_and_draft.output.stale_threads}}"
        label: "{{inputs.nudged_label}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 180
    network_egress: [googleapis.com]
    writes_allowed: [gmail]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
