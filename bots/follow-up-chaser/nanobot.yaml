apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: follow-up-chaser
  version: 0.1.0
  description: Find threads I sent that got no reply in N days and draft a polite nudge.
  tags: [email, gmail, follow-up]
  author: nanobots-community
  license: MIT

spec:
  harness:
    type: openclaw
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 3000
    temperature: 0.3

  services:
    - id: gmail
      provider: google
      scopes: [gmail.readonly, gmail.compose]
      required: true
      connection: demo

  ports:
    inputs:
      - name: days_silent
        type: string
        default: "3"
      - name: exclude_labels
        type: list<string>
        required: false
    outputs:
      - name: stale_threads
        type: list<json>
      - name: draft_ids
        type: list<string>

  steps:
    - name: fetch
      type: service.call
      service: gmail
      op: messages.list
      params: { q: "in:sent older_than:{{inputs.days_silent}}d", max: 100 }
    - name: find_and_draft
      type: ai.generate
      prompt_file: ./prompts/nudge.md
      inputs: { sent: "{{steps.fetch.output}}", exclude_labels: "{{inputs.exclude_labels}}" }
      outputs:
        stale_threads: "{{steps.find_and_draft.output.stale_threads}}"
    - name: create
      type: service.call
      service: gmail
      op: drafts.create
      params: { drafts: "{{steps.find_and_draft.output.drafts}}" }
      outputs:
        draft_ids: "{{steps.create.output.draft_ids}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 180
    network_egress: [googleapis.com]
    writes_allowed: [gmail]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
