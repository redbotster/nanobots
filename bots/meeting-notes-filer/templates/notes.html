<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting notes</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; margin: 48px; max-width: 640px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 14px; margin: 20px 0 8px; }
  .summary { font-size: 13px; line-height: 1.5; margin-bottom: 16px; }
  li { font-size: 13px; line-height: 1.5; margin-bottom: 4px; }
</style>
</head>
<body>
  <h1>Meeting notes</h1>
  <p class="summary">{{.summary}}</p>
  <h2>Decisions</h2>
  <ul>
    {{range .decisions}}<li>{{.}}</li>{{end}}
  </ul>
  <h2>Action items</h2>
  <ul>
    {{range .action_items}}<li>{{.owner}}: {{.task}}{{if .due}} (due {{.due}}){{end}}</li>{{end}}
  </ul>
</body>
</html>
