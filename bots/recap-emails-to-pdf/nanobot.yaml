apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: recap-emails-to-pdf
  version: 0.3.0
  description: Summarise unread Gmail since last run and save a PDF recap to Google Drive.
  tags: [email, reporting, gmail, drive]
  author: nanobots-community
  license: MIT

spec:
  harness:
    type: openclaw
    version: "^1.4"
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 4000
    temperature: 0.2

  services:
    - id: gmail
      provider: google
      scopes: [gmail.readonly]      # see blueprint §4 #1 — not yet in 1Claw's Google registry
      required: true
      # TODO(nanobots#gmail-oauth): see bots/email-drive-file/nanobot.yaml —
      # same deferred-real-OAuth situation, runs against `demo` for now.
      connection: demo
    - id: gdrive
      provider: google
      scopes: [drive.file]
      required: true
      connection: demo

  ports:
    inputs:
      - name: since
        type: datetime
        default: "{{memory.last_run_at | default: now-24h}}"
      - name: label
        type: string
        default: INBOX
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Group by sender. Put anything needing a reply at the top."
    outputs:
      - name: recap_pdf
        type: file
        mime: application/pdf
      - name: recap_json
        type: json
        schema: ./schemas/recap.json
      - name: drive_file_id
        type: string

  steps:
    - name: fetch
      type: service.call
      service: gmail
      op: messages.list
      params: { q: "after:{{inputs.since}} label:{{inputs.label}}", max: 200 }
    - name: summarise
      type: ai.generate
      prompt_file: ./prompts/recap.md
      inputs: { messages: "{{steps.fetch.output}}", instructions: "{{inputs.instructions}}" }
      output: recap_json
    - name: render
      type: transform.render         # runs in-container; see blueprint §4 #5
      template: ./templates/recap.html
      to: pdf
      output: recap_pdf
    - name: upload
      type: service.call
      service: gdrive
      op: files.create
      params: { folder: "{{swarm.vars.recap_folder}}", file: "{{outputs.recap_pdf}}" }
      output: drive_file_id
    - name: remember
      type: memory.put
      key: last_run_at
      value: "{{run.started_at}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 240
    network_egress: [googleapis.com]
    writes_allowed: [gdrive]

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
