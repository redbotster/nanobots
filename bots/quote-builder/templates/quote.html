<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quote</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; margin: 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .customer { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
  th:last-child, td:last-child { text-align: right; }
  .subtotal { font-weight: 600; }
  .notes { margin-top: 20px; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
  <h1>Quote</h1>
  <div class="customer">For {{.customer}}</div>
  <table>
    <tr><th>Item</th><th>Qty</th><th>Unit price</th><th>Total</th></tr>
    {{range .line_items}}
    <tr><td>{{.item}}</td><td>{{.quantity}}</td><td>${{.unit_price}}</td><td>${{.total}}</td></tr>
    {{end}}
    <tr><td colspan="3" class="subtotal">Subtotal</td><td class="subtotal">${{.subtotal}}</td></tr>
  </table>
  {{if .notes}}<p class="notes">{{.notes}}</p>{{end}}
</body>
</html>
