apiVersion: nanobots.dev/v1alpha1
kind: Nanobot
metadata:
  name: repurposer
  version: 0.1.0
  description: Turn one long piece into a thread, a LinkedIn post, and a newsletter blurb.
  tags: [content, social, repurposing]
  author: nanobots-community
  license: LicenseRef-Nanobots-SUL

spec:
  harness:
    type: llm
    entrypoint: ./bot.md

  model:
    provider: anthropic
    name: claude-sonnet-4-6
    max_tokens: 3000
    temperature: 0.5

  ports:
    inputs:
      - name: source
        type: file
        required: true
      - name: instructions
        type: string
        required: false
        description: "How you want this bot to work — tone, priorities, wording. Shapes how it does its job, never what it is allowed to do."
        default: "Keep the original's argument intact. Adapt length and tone, not substance."
    outputs:
      - name: thread
        type: json
      - name: linkedin_post
        type: string
      - name: newsletter_blurb
        type: string

  steps:
    - name: repurpose
      type: ai.generate
      prompt_file: ./prompts/repurpose.md
      inputs: { source: "{{inputs.source}}", instructions: "{{inputs.instructions}}" }
      outputs:
        thread: "{{steps.repurpose.output.thread}}"
        linkedin_post: "{{steps.repurpose.output.linkedin_post}}"
        newsletter_blurb: "{{steps.repurpose.output.newsletter_blurb}}"

  guardrails:
    pii: redact
    injection_threshold: 0.7
    max_runtime_secs: 120

  resources:
    preset: small
    memory: 256Mi
    cpu: 250m
    image: ghcr.io/nanobots/harness-openclaw:1.4-slim
