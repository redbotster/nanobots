<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meeting briefs</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; margin: 48px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .date { color: #6b7280; font-size: 13px; margin-bottom: 24px; }
  .brief { padding: 14px 0; border-top: 1px solid #e5e7eb; }
  .brief:first-of-type { border-top: none; }
  .title { font-weight: 600; font-size: 14px; }
  .time { color: #374151; font-size: 13px; margin: 2px 0 6px; }
  .summary { font-size: 13px; line-height: 1.5; }
  .empty { color: #6b7280; font-style: italic; }
</style>
</head>
<body>
  <h1>Meeting briefs</h1>
  <div class="date">{{.generated_at}}</div>
  {{if .briefs}}
    {{range .briefs}}
    <div class="brief">
      <div class="title">{{.title}}</div>
      <div class="time">{{.time}}</div>
      <div class="summary">{{.summary}}</div>
    </div>
    {{end}}
  {{else}}
    <p class="empty">No meetings today.</p>
  {{end}}
</body>
</html>
