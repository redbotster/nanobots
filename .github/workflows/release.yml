# What a tag publishes.
#
# Three artifacts, all usable by a stranger with no accounts and no tokens:
# the binaries with the WebUI and the bot catalog compiled in, the main
# container image, and (as of this workflow) the two harness images
# (bare, openclaw) a released binary pulls when it has no harness/
# Dockerfile of its own to build from — see internal/runner.EnsureHarnessImage
# and docs/harnesses.md. The main image matters most — `nanobots deploy
# 1claw` needed an image the user had built and pushed themselves, and a
# published one removes that step entirely.
#
# What this deliberately does not publish: the Homebrew cask (the tap repo
# does not exist yet and uploading needs a token this repo does not hold —
# see .goreleaser.yaml) and the npm package (needs an NPM_TOKEN). Both are
# one secret away, and until they exist the README says so rather than
# promising an install that fails.
name: Release

on:
  push:
    tags: ["v*"]
  # So a release can be re-cut without moving a tag, which is the thing you
  # want at 2am when an upload half-failed.
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to build
        required: true

permissions:
  contents: write # create the GitHub Release
  packages: write # push to ghcr.io

jobs:
  binaries:
    name: Binaries and GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser's changelog is built from the commits since the last
          # tag, and a shallow clone has none of them.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The UI is compiled into every published binary by .goreleaser.yaml's
      # `before` hooks, which need npm on the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Pinned, not "latest": this config uses `formats` and
      # `homebrew_casks`, which older versions reject outright — the local
      # check against v2.5.1 failed on exactly that.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Both architectures: a 1Claw Cloud Runtime and an Apple laptop do not
      # agree about which one they are, and an image that runs on only one
      # of them is an image that fails at `docker compose up` for half the
      # people who try it.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  harness-images:
    name: Harness images (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        harness: [bare, openclaw]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged by the exact release tag (v1.2.3), not GoReleaser's
      # semver-stripped {{.Version}} — this workflow builds the image
      # directly, and internal/runner.EnsureHarnessImage re-adds the "v"
      # itself regardless of which convention main.Version arrives in, so
      # either would have worked; the tag name is what a person reading
      # `docker pull` output actually recognizes.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanobots-harness-${{ matrix.harness }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      # Same two architectures as the main image, for the same reason.
      # Context is the whole repo: harness/*/Dockerfile COPYs go.mod,
      # go.sum, cmd/nanobot-agent and internal/ from it, exactly like
      # EnsureHarnessImage's own local `docker build` does.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: harness/${{ matrix.harness }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=harness-${{ matrix.harness }}
          cache-to: type=gha,mode=max,scope=harness-${{ matrix.harness }}
