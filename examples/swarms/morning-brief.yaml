apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: morning-brief
  description: Every weekday morning, triage the inbox and prep today's meetings into one brief.
  owner: me@example.com

# Catalog's S2 is "inbox-triage + meeting-prep -> render-pdf -> notify".
# meeting-prep(6) exists now, but it renders its *own* PDF internally
# (transform.render -> brief_md) rather than producing raw content a shared
# render-pdf step could combine with inbox-triage's — and this build's snaps
# connect one output to one input, with no way to merge two bots' data into
# a single render-pdf call. So both bots run here, each producing its own
# document (inbox-triage's via the shared render-pdf bot, meeting-prep's own
# brief_md standalone) rather than one combined PDF; notify fires off
# inbox-triage's headline, same as before. A real merge would need
# render-pdf's template (or meeting-prep's own) to accept both bots' data
# directly — a bigger change than either bot was built for.

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
    resources: { preset: small }

  vars:
    notify_channel: "slack:#me"

  trigger:
    type: cron
    expr: "30 6 * * 1-5"
    timezone: America/Chicago

  bots:
    - id: triage
      use: inbox-triage@0.1.0
    - id: meetings
      use: meeting-prep@0.1.0
    - id: brief
      use: render-pdf@0.1.0
    - id: notifier
      use: notify@0.1.0
      inputs:
        channel: "{{vars.notify_channel}}"

  snaps:
    - from: triage.triaged_count.brief
      to: brief.content
    - from: triage.triaged_count.headline
      to: notifier.message

  deploy:
    target: local
