apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: never-drop-a-thread
  description: Every afternoon, find sent threads that never got a reply and nudge every one of them.
  owner: me@example.com

# Catalog's S4 is "follow-up-chaser -> approve -> email-send-approved",
# "send each nudge" — which is now what this does: the `.*` snaps fan
# email-send-approved out over every stale thread (see docs/fan-out.md).
# The standalone `approve` brick is still skipped in favor of
# email-send-approved's own built-in, un-bypassable gate, and with fan-out
# that gate opens once for the whole batch, naming its size — "the one
# approval", literally.

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
      approval_required_for: [email.send]
    resources: { preset: small }

  trigger:
    type: cron
    expr: "0 16 * * 1-5"
    timezone: America/Chicago

  bots:
    - id: chaser
      use: follow-up-chaser@0.1.0
    - id: sender
      use: email-send-approved@0.1.0

  snaps:
    - from: chaser.draft_ids.*
      to: sender.draft_id
    - from: chaser.stale_threads.*.subject
      to: sender.summary

  deploy:
    target: local
