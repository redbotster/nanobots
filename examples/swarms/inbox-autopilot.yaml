apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: inbox-autopilot
  description: Every 2 hours during work hours, triage the inbox, draft a reply to everything urgent, and send them all once you approve.
  owner: me@example.com

# Catalog's S3 is "inbox-triage -> draft-replies -> approve ->
# email-send-approved", and describes the one approval as "send each reply"
# — implying one approval per drafted reply. The `.*` snaps now fan
# email-send-approved out over every drafted reply (see docs/fan-out.md),
# so every urgent thread is handled rather than only the first.
#
# Two deliberate differences from the catalog remain. The standalone
# `approve` brick is skipped: email-send-approved's own built-in gate
# (which cannot be bypassed — see its nanobot.yaml) is the one approval,
# and it opens once for the whole batch naming its size, rather than once
# per reply. And there is still no conditional execution based on an
# upstream bot's output, so the standalone brick's approved:boolean would
# have nothing to gate even if it were here.

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
      approval_required_for: [email.send]
    resources: { preset: small }

  trigger:
    type: cron
    expr: "0 */2 * * 1-5"
    timezone: America/Chicago

  bots:
    - id: triage
      use: inbox-triage@0.1.0
    - id: replies
      use: draft-replies@0.1.0
    - id: sender
      use: email-send-approved@0.1.0

  snaps:
    - from: triage.urgent
      to: replies.threads
    - from: replies.draft_ids.*
      to: sender.draft_id
    - from: replies.drafts.*.subject
      to: sender.summary

  deploy:
    target: local
