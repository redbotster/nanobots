apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: meeting-to-action
  description: When a new transcript lands in Drive, file the notes, flag action items to Slack, and draft follow-ups.
  owner: me@example.com

# Catalog's S11: drive-watch -> meeting-notes-filer -> notify (action items)
# -> draft-replies (follow-ups). One honest shape looseness: draft-replies
# expects `threads:list<json>` shaped like email threads ({id, from,
# subject, snippet}), but meeting-notes-filer's `action_items` is shaped
# like {owner, task, due} — both are just `list<json>` with no schema
# enforced on draft-replies' input side, so the whole-list snap type-checks,
# but draft-replies' own prompt (which expects thread-shaped fields) won't
# find what it's looking for. A real fix needs matching shapes or a
# swarm-level reshaping step, neither of which this build has; documented
# rather than hidden, same as lead-to-meeting.yaml's similar case.

# The trigger is a poll, not a push, and that is the honest shape. This
# used to declare `trigger: {type: event, expr: drive.file.created}`, which
# nothing in this build fires and nothing in 1Claw can deliver: its
# automation `trigger_type: event` accepts vault and policy lifecycle
# events, not a new file in your Drive (docs/1claw-feature-requests.md #5).
# So the card read "not wired up yet, so runs on demand" and the swarm
# never ran itself.
#
# Polling hourly is what that gap leaves, and it is now cheap and quiet:
# drive-watch remembers the last file it handed on, so a run with nothing
# new ends at its `stop.if` after one Drive list call, skips everything
# behind it, and shows up as "nothing to do" rather than as another
# success (docs/runs.md).
# At :15 past, offset from repurpose-everything at :45 — both watch a
# Drive folder, and two polls landing on the same minute is a small
# self-inflicted burst for no reason.

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
    resources: { preset: small }

  vars:
    watch_folder: "Transcripts"
    action_items_channel: "slack:#team"

  trigger:
    type: cron
    expr: "15 * * * *"
    timezone: America/Chicago

  bots:
    - id: watcher
      use: drive-watch@0.1.0
      inputs:
        folder: "{{vars.watch_folder}}"
    - id: notes
      use: meeting-notes-filer@0.1.0
    - id: alert
      use: notify@0.1.0
      inputs:
        channel: "{{vars.action_items_channel}}"
      # A notification is the last thing this swarm does and nothing
      # reads it. Losing it should not fail a run whose real work already
      # succeeded — see docs/error-policy.md.
      on_error: continue
    - id: followups
      use: draft-replies@0.1.0

  snaps:
    - from: watcher.file
      to: notes.transcript
    # Every decision, one per line — not `.0`, which alerted on the first
    # and dropped the rest, and died outright on a meeting that reached no
    # decisions at all. That is an ordinary Tuesday, and `lines` renders it
    # as an empty message rather than an out-of-range index.
    - from: notes.decisions
      to: alert.message
      join: lines
    - from: notes.action_items
      to: followups.threads

  deploy:
    target: local
