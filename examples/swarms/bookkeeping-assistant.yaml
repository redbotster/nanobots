apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: bookkeeping-assistant
  description: File today's receipts and produce a spend report with a chart, saved to Drive.
  owner: me@example.com

# Catalog's S9 is deliberately drawn with *two* triggers sharing one swarm:
# receipt-filer runs daily at 18:00, while sheet-reporter -> render-pdf ->
# drive-save -> notify runs Friday at 15:00 as the weekly report. This
# build's Nanoswarm schema has exactly one `trigger:` block per swarm, not
# per-bot conditional scheduling, so both chains collapse onto one schedule
# here (Friday 15:00) rather than the two the catalog describes — a real
# simplification of the schema, not a hidden one. receipt-filer still runs
# every time this swarm does; it just isn't on its own daily cadence.

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
    resources: { preset: small }

  vars:
    notify_channel: "slack:#finance"

  trigger:
    type: cron
    expr: "0 15 * * 5"
    timezone: America/Chicago

  bots:
    - id: receipts
      use: receipt-filer@0.1.0
    - id: reporter
      use: sheet-reporter@0.1.0
      inputs:
        sheet: "Expenses-2026"
        question: "How much did we spend by category this week?"
        period: "this week"
    - id: pdf
      use: render-pdf@0.1.0
    - id: saver
      use: drive-save@0.1.0
      inputs:
        folder: "Reports/2026"
    - id: notifier
      use: notify@0.1.0
      inputs:
        channel: "{{vars.notify_channel}}"
      # A notification is the last thing this swarm does and nothing
      # reads it. Losing it should not fail a run whose real work already
      # succeeded — see docs/error-policy.md.
      on_error: continue

  snaps:
    - from: reporter.report_md
      to: pdf.content
    - from: pdf.pdf
      to: saver.file
    - from: saver.link
      to: notifier.message

  deploy:
    target: local
