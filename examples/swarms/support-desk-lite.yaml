apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: support-desk-lite
  description: Every 30 minutes, triage support mail, flag every escalation to Slack, and send every drafted reply once approved.
  owner: me@example.com

# Catalog's S8 is "support-triage -> draft-replies -> notify (escalations)
# -> approve -> email-send-approved". draft-replies is dropped: support-triage
# already drafts its own replies internally (its `draft_ids` output), so a
# second, separate drafting bot has nothing left to do — support-triage
# doesn't produce the `threads:list<json>` draft-replies would need as
# input anyway. Standalone `approve` is skipped for the same reason as
# every other swarm here — email-send-approved's own built-in gate is the
# one approval, opening once for the whole batch and naming its size. The
# `.*` snaps fan both terminal bots out (see docs/fan-out.md): notify
# alerts on every escalation, and email-send-approved replies to every
# ticket, rather than only the first of each.

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
      approval_required_for: [email.send]
    resources: { preset: small }

  vars:
    escalation_channel: "slack:#support"

  trigger:
    type: cron
    expr: "*/30 * * * *"
    timezone: America/Chicago

  bots:
    - id: triage
      use: support-triage@0.1.0
    - id: alert
      use: notify@0.1.0
      inputs:
        channel: "{{vars.escalation_channel}}"
    - id: sender
      use: email-send-approved@0.1.0

  snaps:
    - from: triage.escalations.*.reason
      to: alert.message
    # Both from `drafted`, not one from draft_ids and one from tickets:
    # those two lists are different lengths whenever a ticket escalates,
    # and fanning out over both made the run die mid-swarm with "they
    # iterate together, so they must be the same length".
    - from: triage.drafted.*.draft_id
      to: sender.draft_id
    - from: triage.drafted.*.subject
      to: sender.summary

  deploy:
    target: local
