apiVersion: nanobots.dev/v1alpha1
kind: Nanoswarm
metadata:
  name: get-paid
  description: Every Monday, find every overdue invoice, send each reminder once approved, and post one summary of what went out.
  owner: me@example.com

# Catalog's S10 is "invoice-chaser -> approve -> email-send-approved ->
# notify", "the batch of reminders" as the one approval. Standalone
# `approve` is skipped, same reason as every other swarm here —
# email-send-approved's own built-in gate is the one approval.
#
# This chased only the first overdue invoice until `join:` existed.
# Fanning `sender` out was never the problem; what was missing was the way
# back — `sender` feeds `notifier`, and fanning it left notifier either
# posting one Slack message per invoice or confirming only the first send.
# `join: lines` collapses the fanned-out sender's outputs into the one
# summary this wants (docs/fan-out.md).

spec:
  defaults:
    model: { provider: anthropic, name: claude-sonnet-4-6 }
    guardrails:
      pii: redact
      injection_threshold: 0.7
      daily_budget_usd: 5
      approval_required_for: [email.send]
    resources: { preset: small }

  vars:
    notify_channel: "slack:#finance"

  trigger:
    type: cron
    expr: "0 8 * * 1"
    timezone: America/Chicago

  bots:
    - id: chaser
      use: invoice-chaser@0.1.0
    - id: sender
      use: email-send-approved@0.1.0
    - id: notifier
      use: notify@0.1.0
      inputs:
        channel: "{{vars.notify_channel}}"
      # A notification is the last thing this swarm does and nothing
      # reads it. Losing it should not fail a run whose real work already
      # succeeded — see docs/error-policy.md.
      on_error: continue

  snaps:
    # One reminder per overdue invoice. Both sides come from `drafted`, not
    # one from draft_ids and one from overdue: fanned snaps iterate in
    # lockstep on one index, so they must be one list.
    - from: chaser.drafted.*.draft_id
      to: sender.draft_id
    - from: chaser.drafted.*.subject
      to: sender.summary
    # And back to one value: every reminder that actually went out, one per
    # line, as a single Slack message.
    - from: sender.acted_on
      to: notifier.message
      join: lines

  deploy:
    target: local
