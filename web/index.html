<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%2305070d'/%3E%3Crect x='4' y='2' width='6' height='20' fill='%2300d4ff'/%3E%3C/svg%3E"
    />
    <title>nanobots</title>
    <!-- Stamp the saved theme before first paint. Doing this from React
         instead would flash the default dark theme at anyone who chose
         light, on every single load. Kept inline and tiny for that reason;
         src/lib/theme.ts owns the same key and the same semantics. -->
    <script>
      try {
        var t = localStorage.getItem("nanobots.theme");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
